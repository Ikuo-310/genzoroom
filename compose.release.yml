services:
  genzoroom:
    # Require an explicitly published validation or stable tag; never fall back to latest.
    image: ghcr.io/ikuo-310/genzoroom:${GENZOROOM_IMAGE_TAG:?Set GENZOROOM_IMAGE_TAG to a published tag}
    ports:
      - "${GENZOROOM_PORT:-3190}:3190"
    volumes:
      # SQLite needs directory write access, including WAL/SHM creation.
      - type: bind
        source: ${GENZOROOM_PERSIST_ROOT:?Set GENZOROOM_PERSIST_ROOT}
        target: /genzoroom
        bind:
          create_host_path: false
    environment:
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
    restart: unless-stopped
    # Allow the supervisor's bounded drain and final child reaping before Docker SIGKILL.
    stop_grace_period: 75s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      outbound:

networks:
  outbound:
