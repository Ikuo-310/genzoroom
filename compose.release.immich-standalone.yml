# Complete same-host distribution configuration for Portainer Web editor.
services:
  genzoroom:
    image: ghcr.io/ikuo-310/genzoroom:${GENZOROOM_IMAGE_TAG:?Set GENZOROOM_IMAGE_TAG to a published tag}
    ports:
      - "${GENZOROOM_PORT:-3190}:8080"
    volumes:
      - type: bind
        source: ${GENZOROOM_PERSIST_ROOT:?Set GENZOROOM_PERSIST_ROOT}
        target: /genzoroom
        bind:
          create_host_path: false
    environment:
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
    restart: unless-stopped
    stop_grace_period: 75s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      outbound:
      immich:

networks:
  outbound:
  immich:
    external: true
    name: ${IMMICH_DOCKER_NETWORK:?Set IMMICH_DOCKER_NETWORK to an existing Immich Docker network}
