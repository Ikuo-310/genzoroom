name: Publish distribution image

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA already on main (validation image)
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  prepare:
    # Forks and non-main dispatches must not acquire publishing permissions.
    if: >-
      github.repository == 'Ikuo-310/genzoroom' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      automation_commit: ${{ steps.source.outputs.automation_commit }}
      image_tag: ${{ steps.source.outputs.image_tag }}
      channel: ${{ steps.source.outputs.channel }}
      version: ${{ steps.source.outputs.version }}
      alpha_eligible: ${{ steps.source.outputs.alpha_eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and select tag
        id: source
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: bash release/prepare-image.sh

  publish:
    needs: prepare
    # Serialize validation publishers so an older run cannot finish after a newer alpha update.
    concurrency:
      group: publish-${{ github.repository }}-${{ github.event_name }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ghcr.io/ikuo-310/genzoroom:${{ needs.prepare.outputs.image_tag }}
      ALPHA_REF: ghcr.io/ikuo-310/genzoroom:alpha
      ALPHA_ELIGIBLE: ${{ needs.prepare.outputs.alpha_eligible }}
      EXPECTED_REVISION: ${{ needs.prepare.outputs.commit }}
      GENZOROOM_CHANNEL: ${{ needs.prepare.outputs.channel }}
      GENZOROOM_VERSION: ${{ needs.prepare.outputs.version }}
      GENZOROOM_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      # Keep trusted tooling separate from the requested source commit, including older main commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.automation_commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image to test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./source
          file: ./source/Dockerfile.release
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: |
            GENZOROOM_CHANNEL=${{ env.GENZOROOM_CHANNEL }}
            GENZOROOM_VERSION=${{ env.GENZOROOM_VERSION }}
            GENZOROOM_COMMIT=${{ env.GENZOROOM_COMMIT }}
          tags: ${{ env.IMAGE_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/Ikuo-310/genzoroom
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Verify startup, storage and graceful shutdown before publishing
        run: bash release/smoke-test.sh
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed the smoke test
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"
          digest_ref=$(docker image inspect "$IMAGE_REF" --format '{{index .RepoDigests 0}}')
          {
            printf 'Image: `%s`\n\n' "$IMAGE_REF"
            printf 'Source commit: `%s`\n\n' "$EXPECTED_REVISION"
            printf 'Digest reference: `%s`\n\n' "$digest_ref"
            printf 'Platform: `linux/amd64`. Anonymous pull still requires Public package visibility and separate verification.\n\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish alpha only for the latest main image
        run: |
          set -euo pipefail
          trap 'printf "Alpha: publication failed before digest verification completed.\n" >> "$GITHUB_STEP_SUMMARY"' ERR
          if [[ "$ALPHA_ELIGIBLE" != true ]]; then
            printf 'Alpha: skipped; selected source was not the main tip during preparation.\n' >> "$GITHUB_STEP_SUMMARY"
            trap - ERR
            exit 0
          fi
          git fetch --quiet --no-tags origin main
          latest_main=$(git rev-parse FETCH_HEAD)
          if [[ "$latest_main" != "$EXPECTED_REVISION" ]]; then
            printf 'Alpha: skipped; main advanced to `%s` before publication.\n' "$latest_main" >> "$GITHUB_STEP_SUMMARY"
            trap - ERR
            exit 0
          fi
          source_image_id=$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')
          docker image tag "$IMAGE_REF" "$ALPHA_REF"
          docker push "$ALPHA_REF"
          alpha_image_id=$(docker image inspect "$ALPHA_REF" --format '{{.Id}}')
          [[ "$source_image_id" == "$alpha_image_id" ]]
          image_digest=$(docker buildx imagetools inspect --raw "$IMAGE_REF" | sha256sum | cut -d ' ' -f1)
          alpha_digest=$(docker buildx imagetools inspect --raw "$ALPHA_REF" | sha256sum | cut -d ' ' -f1)
          [[ "$image_digest" == "$alpha_digest" ]]
          {
            printf 'Alpha: `%s`\n\n' "$ALPHA_REF"
            printf 'Alpha digest: `sha256:%s` (matches the smoke-tested image).\n' "$alpha_digest"
          } >> "$GITHUB_STEP_SUMMARY"
          trap - ERR
