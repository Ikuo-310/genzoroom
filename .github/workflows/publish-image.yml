name: Publish distribution image

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA already on main (validation image)
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  prepare:
    # Forks and non-main dispatches must not acquire publishing permissions.
    if: >-
      github.repository == 'Ikuo-310/genzoroom' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      automation_commit: ${{ steps.source.outputs.automation_commit }}
      image_tag: ${{ steps.source.outputs.image_tag }}
      channel: ${{ steps.source.outputs.channel }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and select tag
        id: source
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: bash release/prepare-image.sh

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ghcr.io/ikuo-310/genzoroom:${{ needs.prepare.outputs.image_tag }}
      EXPECTED_REVISION: ${{ needs.prepare.outputs.commit }}
      GENZOROOM_CHANNEL: ${{ needs.prepare.outputs.channel }}
      GENZOROOM_VERSION: ${{ needs.prepare.outputs.version }}
      GENZOROOM_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      # Keep trusted tooling separate from the requested source commit, including older main commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.automation_commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: source
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image to test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./source
          file: ./source/Dockerfile.release
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          build-args: |
            GENZOROOM_CHANNEL=${{ env.GENZOROOM_CHANNEL }}
            GENZOROOM_VERSION=${{ env.GENZOROOM_VERSION }}
            GENZOROOM_COMMIT=${{ env.GENZOROOM_COMMIT }}
          tags: ${{ env.IMAGE_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/Ikuo-310/genzoroom
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - name: Verify startup, storage and graceful shutdown before publishing
        run: bash release/smoke-test.sh
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed the smoke test
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"
          digest_ref=$(docker image inspect "$IMAGE_REF" --format '{{index .RepoDigests 0}}')
          {
            printf 'Image: `%s`\n\n' "$IMAGE_REF"
            printf 'Source commit: `%s`\n\n' "$EXPECTED_REVISION"
            printf 'Digest reference: `%s`\n\n' "$digest_ref"
            printf 'Platform: `linux/amd64`. Anonymous pull still requires Public package visibility and separate verification.\n'
          } >> "$GITHUB_STEP_SUMMARY"
